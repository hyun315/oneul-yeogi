<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>배너 만들기 — 오늘 여기</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --dusk:#2A2440;--paper:#F2EFF4;--card:#fff;--ink:#221D2E;--ink-2:#6A6480;
  --here:#2F8F7D;--home:#C4453E;--line:rgba(34,29,46,.13);
  --body:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
header{background:var(--dusk);color:#EFECF5;padding:18px 0}
header .in{max-width:760px;margin:0 auto;padding:0 18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600}
header p{margin:0;font-size:12px;color:rgba(239,236,245,.6)}
:focus-visible{outline:2px solid var(--here);outline-offset:2px}

.cap{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:7px}
.field{margin-top:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=color],select{
  width:100%;font-family:var(--body);font-size:15px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
}
input[type=color]{padding:4px;height:42px}
input[type=range]{width:100%}
.rangeval{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.chips{display:flex;gap:7px}
.chip{flex:1;text-align:center;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
button{font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;border-radius:9px;padding:12px 16px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
button.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
button.sm{padding:8px 13px;font-size:13px}
button:disabled{opacity:.4;cursor:default}

.stage{margin-top:18px;background:repeating-conic-gradient(#e3e0ea 0% 25%,#eeecf1 0% 50%) 0 0/16px 16px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:auto}
.hint{font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.55}

.upl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upl input[type=file]{font-size:12.5px}
.rm{font-family:var(--mono);font-size:11px;color:var(--home);background:none;border:none;padding:4px 0;cursor:pointer;text-decoration:underline}

.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
h2{font-size:14px;margin:28px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.ok{background:rgba(47,143,125,.1);border:1px solid rgba(47,143,125,.3);border-radius:9px;padding:12px 14px;font-size:13px;margin-top:14px}
.warn{background:rgba(196,69,62,.08);border:1px solid rgba(196,69,62,.25);border-radius:9px;padding:12px 14px;font-size:13px;margin-top:14px}
.urlbox{
  display:flex;gap:8px;align-items:center;margin-top:10px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;
}
.urlbox input{border:none;font-family:var(--mono);font-size:12px;flex:1;background:none;padding:0}
</style>
</head>
<body>

<header>
  <div class="in">
    <h1>배너 만들기</h1>
    <p>1200 × 250 — 상호명과 문구만 넣어도 완성됩니다</p>
  </div>
</header>

<div class="wrap">

  <div class="stage">
    <canvas id="cv" width="1200" height="250"></canvas>
  </div>
  <p class="hint">왼쪽 위 모서리 점선은 <b>AD</b> 표시가 겹치는 자리입니다 (미리보기에만 표시, 실제 파일엔 없음). 그 자리는 비워두시는 게 좋습니다.</p>

  <h2>배경</h2>
  <div class="field">
    <span class="cap">채우기 방식</span>
    <div class="chips">
      <button class="chip" id="modeSolid" aria-pressed="true">단색</button>
      <button class="chip" id="modeGrad" aria-pressed="false">그라디언트</button>
    </div>
  </div>
  <div class="field two">
    <div>
      <span class="cap">배경색</span>
      <input type="color" id="bg1" value="#2A2440" />
    </div>
    <div id="bg2wrap" style="display:none">
      <span class="cap">두 번째 색</span>
      <input type="color" id="bg2" value="#3B3457" />
    </div>
  </div>

  <h2>로고 (선택)</h2>
  <div class="field upl">
    <input type="file" id="logoFile" accept="image/*" />
    <button class="rm" id="logoClear" style="display:none">로고 지우기</button>
  </div>
  <div class="field" id="logoSizeWrap" style="display:none">
    <span class="cap">로고 크기 <span class="rangeval" id="logoSizeVal"></span></span>
    <input type="range" id="logoSize" min="60" max="220" value="140" />
  </div>

  <h2>문구</h2>
  <div class="field">
    <span class="cap">상호명 (필수)</span>
    <input type="text" id="headline" maxlength="40" placeholder="예: 자카르타 한마음이사" value="상호명을 입력하세요" />
  </div>
  <div class="field">
    <span class="cap">부제 (선택)</span>
    <input type="text" id="subline" maxlength="60" placeholder="예: 포장부터 통관까지, 한국어 상담" />
  </div>
  <div class="field two">
    <div>
      <span class="cap">글자 색</span>
      <input type="color" id="textColor" value="#F7F8F3" />
    </div>
    <div>
      <span class="cap">정렬</span>
      <div class="chips">
        <button class="chip" id="alignLeft" aria-pressed="true">왼쪽</button>
        <button class="chip" id="alignCenter" aria-pressed="false">가운데</button>
      </div>
    </div>
  </div>
  <div class="field">
    <span class="cap">상호명 글자 크기 <span class="rangeval" id="hSizeVal"></span></span>
    <input type="range" id="hSize" min="56" max="120" value="88" />
  </div>

  <h2>내보내기</h2>
  <div class="actions">
    <button class="solid" id="download">PNG로 저장</button>
    <button id="toBlob">배너 목록에 바로 올리기</button>
  </div>
  <div id="msg"></div>

  <div class="foot"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

let state = {
  mode:'solid', bg1:'#2A2440', bg2:'#3B3457',
  logo:null, logoSize:140,
  headline:'상호명을 입력하세요', subline:'',
  textColor:'#F7F8F3', align:'left', hSize:88,
};

function wrapLines(text, maxWidth){
  const words = text.split(' ');
  const lines = []; let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines.slice(0, 2);   // 두 줄까지만
}

function draw(){
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);

  // 배경
  if (state.mode === 'grad'){
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, state.bg1); g.addColorStop(1, state.bg2);
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = state.bg1;
  }
  ctx.fillRect(0, 0, W, H);

  const pad = 46;
  let textX = pad;
  const textW0 = W - pad * 2;
  let textW = textW0;

  // 로고
  if (state.logo){
    const box = state.logoSize;
    const scale = Math.min(box / state.logo.width, box / state.logo.height);
    const lw = state.logo.width * scale, lh = state.logo.height * scale;
    const lx = pad, ly = (H - lh) / 2;
    ctx.drawImage(state.logo, lx, ly, lw, lh);
    textX = pad + box + 30;
    textW = W - textX - pad;
  }

  // 문구
  ctx.fillStyle = state.textColor;
  ctx.textBaseline = 'alphabetic';

  const hSize = state.hSize;
  ctx.font = `700 ${hSize}px Pretendard, -apple-system, sans-serif`;
  const hLines = wrapLines(state.headline || '', textW);
  const sSize = Math.round(hSize * 0.36);

  const lineGap = hSize * 1.12;
  const hBlockH = hLines.length * lineGap;
  const sBlockH = state.subline ? sSize * 1.5 : 0;
  const totalH = hBlockH + sBlockH;
  let cy = (H - totalH) / 2 + hSize * 0.82;

  const alignX = t => {
    if (state.align !== 'center') return textX;
    const w = ctx.measureText(t).width;
    return textX + (textW - w) / 2;
  };

  ctx.font = `700 ${hSize}px Pretendard, -apple-system, sans-serif`;
  hLines.forEach(line => {
    ctx.fillText(line, alignX(line), cy);
    cy += lineGap;
  });

  if (state.subline){
    ctx.font = `500 ${sSize}px Pretendard, -apple-system, sans-serif`;
    ctx.globalAlpha = 0.82;
    ctx.fillText(state.subline, alignX(state.subline), cy - lineGap + sSize * 1.3);
    ctx.globalAlpha = 1;
  }
}

// 안전영역 안내선 (미리보기 전용, PNG엔 안 들어감)
function drawGuide(){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.setLineDash([4, 4]);
  ctx.strokeRect(0.5, 0.5, 70, 26);
  ctx.restore();
}

function render(){ draw(); drawGuide(); }

async function loadFont(){
  try { await document.fonts.load('700 88px Pretendard'); } catch {}
  render();
}

/* ── 이벤트 ── */
$('modeSolid').addEventListener('click', () => {
  state.mode = 'solid';
  $('modeSolid').setAttribute('aria-pressed','true');
  $('modeGrad').setAttribute('aria-pressed','false');
  $('bg2wrap').style.display = 'none';
  render();
});
$('modeGrad').addEventListener('click', () => {
  state.mode = 'grad';
  $('modeGrad').setAttribute('aria-pressed','true');
  $('modeSolid').setAttribute('aria-pressed','false');
  $('bg2wrap').style.display = 'block';
  render();
});
$('bg1').addEventListener('input', e => { state.bg1 = e.target.value; render(); });
$('bg2').addEventListener('input', e => { state.bg2 = e.target.value; render(); });

$('logoFile').addEventListener('change', e => {
  const f = e.target.files?.[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    state.logo = img;
    $('logoSizeWrap').style.display = 'block';
    $('logoClear').style.display = 'inline';
    render();
  };
  img.src = URL.createObjectURL(f);
});
$('logoClear').addEventListener('click', () => {
  state.logo = null;
  $('logoFile').value = '';
  $('logoSizeWrap').style.display = 'none';
  $('logoClear').style.display = 'none';
  render();
});
$('logoSize').addEventListener('input', e => {
  state.logoSize = +e.target.value;
  $('logoSizeVal').textContent = `${e.target.value}px`;
  render();
});

$('headline').addEventListener('input', e => { state.headline = e.target.value; render(); });
$('subline').addEventListener('input', e => { state.subline = e.target.value; render(); });
$('textColor').addEventListener('input', e => { state.textColor = e.target.value; render(); });
$('hSize').addEventListener('input', e => {
  state.hSize = +e.target.value;
  $('hSizeVal').textContent = `${e.target.value}px`;
  render();
});
$('alignLeft').addEventListener('click', () => {
  state.align = 'left';
  $('alignLeft').setAttribute('aria-pressed','true');
  $('alignCenter').setAttribute('aria-pressed','false');
  render();
});
$('alignCenter').addEventListener('click', () => {
  state.align = 'center';
  $('alignCenter').setAttribute('aria-pressed','true');
  $('alignLeft').setAttribute('aria-pressed','false');
  render();
});

function exportBlob(){
  draw();   // 안내선 없이 순수 그림만
  return new Promise(res => cv.toBlob(res, 'image/png', 0.95));
}

$('download').addEventListener('click', async () => {
  const blob = await exportBlob();
  render();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `banner-${Date.now()}.png`;
  a.click();
});

function note(kind, html){
  $('msg').innerHTML = `<div class="${kind}">${html}</div>`;
}

$('toBlob').addEventListener('click', async () => {
  let key = sessionStorage.getItem('oy.admin');
  if (!key){
    key = prompt('관리자 비밀번호를 입력하세요 (배너 목록 화면과 같은 비밀번호)');
    if (!key) return;
    sessionStorage.setItem('oy.admin', key);
  }

  const btn = $('toBlob');
  btn.disabled = true; btn.textContent = '올리는 중…';

  try {
    const blob = await exportBlob();
    render();
    const r = await fetch(`/api/upload?name=banner-${Date.now()}.png`, {
      method:'POST',
      headers:{ 'content-type':'image/png', 'x-admin-key':key },
      body: blob,
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '업로드 실패');

    note('ok', `올렸습니다. 아래 주소를 복사해 <b>배너 관리</b> 화면의 배너 이미지 칸에 붙여넣고 저장하세요.
      <div class="urlbox">
        <input type="text" readonly value="${d.url}" id="resultUrl" />
        <button class="sm" id="copyUrl">복사</button>
        <a class="sm" href="/admin.html" style="text-decoration:none;display:inline-block">배너 관리 열기</a>
      </div>`);
    $('copyUrl').addEventListener('click', () => {
      $('resultUrl').select();
      document.execCommand('copy');
      $('copyUrl').textContent = '복사됨';
      setTimeout(() => { $('copyUrl').textContent = '복사'; }, 1500);
    });
  } catch (err) {
    if (String(err.message).includes('401') || String(err.message).includes('권한')){
      sessionStorage.removeItem('oy.admin');
      note('warn', '비밀번호가 맞지 않습니다. 다시 시도해 주세요.');
    } else {
      note('warn', err.message || '업로드에 실패했습니다');
    }
  } finally {
    btn.disabled = false; btn.textContent = '배너 목록에 바로 올리기';
  }
});

loadFont();
</script>
</body>
</html>
